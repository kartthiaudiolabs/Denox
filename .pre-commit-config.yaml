#
# The style gate CI runs (.github/workflows/ci.yml), before each commit:
#   pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (Google profile, pyproject.toml)
        entry: isort
        language: system
        types: [python]
        # a wrapper's bytes are part of every receipt of its renders
        exclude: ^bench/wrappers/
  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        args: [--in-place, --parallel]
  - repo: local
    hooks:
      - id: pylint
        name: pylint (the Google style guide's pylintrc)
        entry: pylint --rcfile=.pylintrc
        language: system
        types: [python]
