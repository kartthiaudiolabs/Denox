<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="551" viewBox="0 0 1040 551" role="img" aria-label="Inworld Voice Isolator architecture">
<desc>Input x(t), 48 kHz mono. STFT with N = 2048 and hop H = 480 (10 ms) gives X in C^(F x T), F = 1025 bins. Band split into B = 46 bands, 100 Hz to 2 kHz wide, each projected to D = 512, gives Z in R^(B x T x D). Seven dual-path blocks, alternating A, M, A, M, A, M, A: block A is time attention (rotary positions, exclusive self-attention, 8 heads) then band attention; block M is time Mamba (state 16, expand 2, conv 4) then band Mamba; the time path runs along time within each band, the band path across bands within each frame; every sub-layer has a residual connection. Per-band linear heads produce a bounded complex mask M and a bounded residual R, both in C^(F x T). Output spectrum X_hat = X + M (.) X + R, from the input spectrum X through a skip connection; iSTFT gives the isolated voice s_hat(t). The realtime checkpoint runs the same blocks causally with a look-ahead of 0, 2 or 4 frames as a learned embedding; the offline checkpoint is two-sided and renders 8 s chunks.</desc>
